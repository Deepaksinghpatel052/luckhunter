<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Razorpay merchant payment page</title>
    <style type="text/css">
    	body{
    		text-align: center;
    	}
    </style>
</head>
<body>
<h1>Redirecting you to the merchant....</h1>
<h2>Please do not refresh this page....</h2>

<form id="razorpay-callback-form" action="{{ parem_dict.callback_url }}" method="post">
    <input type="hidden" name="razorpay_payment_id" id="razorpay_payment_id_field">
    <input type="hidden" name="razorpay_order_id" id="razorpay_order_id_field">
    <input type="hidden" name="razorpay_signature" id="razorpay_signature_field">
</form>

<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<script>
    var options = {
        "key": "{{ parem_dict.razorpay_key_id }}",
        "amount": "{{ parem_dict.amount }}",
        "currency": "{{ parem_dict.currency }}",
        "name": "LuckHunter",
        "order_id": "{{ parem_dict.razorpay_order_id }}",
        "prefill": {
            "name": "{{ parem_dict.cust_name }}"
        },
        "handler": function (response) {
            document.getElementById('razorpay_payment_id_field').value = response.razorpay_payment_id;
            document.getElementById('razorpay_order_id_field').value = response.razorpay_order_id;
            document.getElementById('razorpay_signature_field').value = response.razorpay_signature;
            document.getElementById('razorpay-callback-form').submit();
        },
        "modal": {
            "ondismiss": function () {
                window.location.href = "{{ BASE_URL }}user/orders";
            }
        }
    };
    var rzp1 = new Razorpay(options);
    rzp1.open();
</script>
</body>
</html>
